[package]
name = "rust_agent"
version = "0.3.0"
edition = "2021"
description = "A CLI coding agent powered by LLM, similar to Claude Code"
license = "MIT"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
# Async runtime (trimmed from "full" to only needed features)
tokio = { version = "1", features = [
  "rt-multi-thread", "macros", "sync", "net",
  "io-util", "io-std", "time", "fs", "process", "signal",
] }

# HTTP client for LLM API (rustls = pure Rust TLS, no system OpenSSL dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI interface
clap = { version = "4", features = ["derive", "env"] }

# Terminal UI
colored = "2"

# Low-level Unix terminal control (termios save/restore)
libc = "0.2"

# Interactive line editor
rustyline = "14"

# Async streaming
tokio-stream = "0.1"
futures = { version = "0.3", features = ["thread-pool"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Lazy global initialization
once_cell = "1"

# Environment & config
dotenvy = "0.15"
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID for message IDs
uuid = { version = "1", features = ["v4"] }

# Regex for parsing
regex = "1"

# File watching / globbing
glob = "0.3"

# Markdown rendering in terminal
termimad = "0.30"

# Async trait support
async-trait = "0.1"

# URL parsing
url = "2"

# WebSocket server (for --mode server)
tokio-tungstenite = "0.24"

# Text diffing (used by sandbox to show overlay changes)
similar = "2"

# Base64 encoding for image upload
base64 = "0.21"

# Precise token counting (optional — falls back to heuristic if not available)
tiktoken-rs = { version = "0.11", optional = true }

# Browser automation with CDP (optional — gated behind "browser" feature)
chromiumoxide = { version = "0.9.1", optional = true }
# Date/time (used by plugin manager + browser)
chrono = "0.4.44"

# Graph algorithms for batch action dependency ordering (browser only)
petgraph = { version = "0.6", optional = true }

# Compression libraries (browser protocol serialization only)
flate2 = { version = "1.0", optional = true }
brotli = { version = "3.4", optional = true }
lz4 = { version = "1.24", optional = true }
zstd = { version = "0.13", optional = true }

# Async utilities
futures-util = "0.3"

# SQLite global database (bundled = no system dep)
rusqlite = { version = "0.31", features = ["bundled"] }

# PTY support (terminal feature)
portable-pty = "0.8"

# Serialization formats (browser protocol only)
bson = { version = "2.8", optional = true }
ciborium = { version = "0.2", optional = true }
rmp-serde = { version = "1.1", optional = true }

[features]
default = ["tiktoken"]
tiktoken = ["tiktoken-rs"]
# Browser automation via Chrome DevTools Protocol.
# Adds ~10 MB to binary. Disable for smaller CLI-only builds.
browser = [
  "chromiumoxide",
  "petgraph",
  "flate2", "brotli", "lz4", "zstd",
  "bson", "ciborium", "rmp-serde",
]

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization (slower build, smaller binary)
codegen-units = 1      # Single codegen unit for better inlining/optimization
strip = true           # Strip debug symbols
panic = "abort"        # Remove unwind tables (smaller binary)

[dev-dependencies]
# Testing utilities
tempfile = "3.10"
